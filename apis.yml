aid: goodfellow
name: Goodfellow
description: >-
  Goodfellow (Goodfellow Advanced Materials) is a global specialty-materials
  supplier founded in 1946 and headquartered in Cambridgeshire, United Kingdom,
  serving research, prototyping and specialized manufacturing markets in more
  than 111 countries. Its catalog spans over 70,000 stocked products drawn from
  700+ different materials in many forms, including metals, alloys, ceramics,
  polymers, composites, compounds and glass, alongside custom fabrication and
  laboratory testing services. Customers include universities, government
  research facilities, laboratories and advanced manufacturers, served through
  subsidiaries in the United States, China, France and Germany. Goodfellow was
  acquired by Battery Ventures in 2021 to help digitize its operations and fund
  materials acquisitions. Goodfellow is a business-to-business e-commerce and
  catalog operation; it does not currently publish a public developer API,
  developer portal, SDKs or webhooks.
